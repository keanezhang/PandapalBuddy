# ── DeepSeek（官方 api-docs pricing，元/百万 token）──────────────────────────
# 来源：https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# 官方当前在售 v4 系列（2026-07 核证）：分时双档价——空闲时段为高峰的一半；
#   高峰时段 = 北京时间 9:00-12:00、14:00-18:00（本文件 [tiers].peak_windows）。
#   模型版本：DeepSeek-V4-Flash-0731 / DeepSeek-V4-Pro-0813。
