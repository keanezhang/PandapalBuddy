# ─────────────────────────────────────────────────────────────────────────────
# model_prices.toml — 系统预置模型默认单价（只读，随软件发布）
#
# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  ⚠️ 本表**不是**可用性白名单。                                              ║
# ║                                                                           ║
# ║  表中没有的 model_id 照样可以配置、装配、路由、使用——只是保存时必须由       ║
# ║  用户自己填写单价。任何「不在本表内就不装配 / 不展示 / 不允许保存」的        ║
# ║  逻辑，都是已被删除的 _DECLARED_MODELS 白名单换马甲复活，明令禁止。         ║
# ║                                                                           ║
# ║  本表唯一的作用：决定「用户要不要自己填价」。                               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# 单价三级回落（PRD·R5）：
#   ① 用户在凭据中填了单价      → 用用户的
#   ② 用户没填，但本表命中      → 用本表默认价
#   ③ 两者皆无                  → **拒绝保存**，要求用户填写
#
# 因此「已保存的模型必然有确定单价」是系统不变量。未定价兜底桶正常应恒为 0，
# 非 0 即缺陷信号（P0 告警），而非常规路径。
#
# ⚠️ 绝不允许在查不到单价时回落 0（§九：金额类字段缺失绝不默认 0）。
#    这正是本次重构要修掉的原始缺陷。
#
# 匹配语义：对 model_id **精确匹配**，不做前缀/模糊匹配。
#   原因：模糊匹配会让 qwen3-max 悄悄套用 qwen-max 的价，属金额类静默降级。
#
# 与 provider_catalog.toml 分为两个文件的原因：
#   provider 元信息极少变动，而模型定价随厂商调价频繁更新，
#   二者变更频率与职责均不同。
#
# 读取方（运行时读取，禁止编译期嵌入）：
#   - Python : pandapal/config/llm/（费用核算取价）
#   - Rust   : src-tauri/src/lib.rs（保存时判断「该模型是否必须用户填价」）
# ─────────────────────────────────────────────────────────────────────────────

# ── 汇率 ─────────────────────────────────────────────────────────────────────
# 1 USD = N CNY。单价以 CNY 填写与展示，核算后按此汇率归一为 USD 存入
# BudgetRow.spent_usd；预算额度以 CNY 记于 BudgetRow.limit_native（currency="CNY"）。
#
# ⚠️ 这是**静态汇率**，不接实时汇率源——有意为之。实时汇率会让「同一笔消费在
#    不同时刻算出不同金额」，破坏账目可复现性。汇率变动由发布者随版本调整。
# ⚠️ 缺失、为 0 或为负 → **拒绝启动并报错**，绝不默认回落 7.0（§九：金额类字段）。
exchange_rate_usd = 7.0


# ── 高峰时段表（分时段双档价的开关）────────────────────────────────────────
# 高峰时段窗口（本地时间，24h 制，"HH:MM" 格式）。每个窗口为闭开区间
# [start, end)：09:00 整点进入高峰，12:00 整点离开（午餐空闲），14:00 再入，
# 18:00 离开。窗口之外的时间一律按空闲价计费。
# ⚠️ 2026-07 按 DeepSeek 官方定价页核证：高峰时段为北京时间 9:00-12:00、14:00-18:00
#   （原默认 13:00-18:00 的下午段已修正为 14:00 起）。本窗口为**全局**判定；
#   无 peak_* 字段的模型不分时，不受窗口影响。
# 支持跨午夜窗口（如 [["23:00","01:00"]]）；start == end 视为非法被跳过。
# ⚠️ 缺失本段 → 使用默认窗口 09:00-12:00 / 14:00-18:00 并告警日志
#   （时段是增强项，缺了只是不分时，不拒绝启动——区别于汇率的硬校验）。
[tiers]
peak_windows = [["09:00", "12:00"], ["14:00", "18:00"]]


# ── 默认单价表（CNY / 每 1k token）───────────────────────────────────────────
#
# 字段说明：
# - model_id                 : 精确匹配用户填写的 model_id，全表唯一
# - provider                 : 归属 provider（须在 provider_catalog.toml 内），
#                              用于 model_id combobox 按 provider 归类推荐
# - input_price_per_1k       : 输入单价（CNY/1k token），必填
# - output_price_per_1k      : 输出单价（CNY/1k token），必填
# - cache_read_price_per_1k  : 命中 prefix cache 的输入单价，可选；
#                              缺省时取 input_price_per_1k（保守估高，绝不低估费用）
# - peak_input_price_per_1k  : 高峰时段输入单价，可选；缺省 = input_price_per_1k
# - peak_output_price_per_1k : 高峰时段输出单价，可选；缺省 = output_price_per_1k
# - peak_cache_read_price_per_1k : 高峰时段缓存命中单价，可选；
#                              缺省 = cache_read_price_per_1k
#
# ⚠️ peak_* 三字段全缺省 = 该模型不分时（高峰=空闲=单档价），完全向后兼容。
#    高峰价数值需按厂商公开价核证后填写，**不得臆造**——暂无核证数据时留空即可。
#
# ⚠️ 数值为各厂商官方公开价（CNY/百万 token 折算为 CNY/1k token，÷1000），
#    核证日期 2026-07，来源见各段注释。厂商调价后需随版本同步更新。
#    - 阿里云百炼：输入/输出为官方价，缓存命中按官方规则 = 输入价 × 10%
#    - DeepSeek  ：官方 api-docs pricing（缓存命中价单独公布）
#    - 火山方舟  ：官方计价页，缓存命中按官方规则 = 输入价 × 20%
#    - OpenAI    ：官方 pricing（USD → CNY 按 exchange_rate_usd 折算）
#    用户若有采购折扣，可在凭据中填写自己的单价覆盖本表。

# ── DashScope · 通义千问 Qwen（阿里云百炼官方价，华北2·北京，元/百万 token）──
# 来源：https://help.aliyun.com/zh/model-studio/model-pricing
# 缓存命中按百炼上下文缓存规则 = 输入价 × 10%；输出取非思考模式价。
[[prices]]
model_id = "qwen-max"
provider = "dashscope"
input_price_per_1k = 0.0024
output_price_per_1k = 0.0096
cache_read_price_per_1k = 0.00024

